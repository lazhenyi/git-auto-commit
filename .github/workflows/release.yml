name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: gac-linux-x64
          - target: bun-linux-arm64
            asset: gac-linux-arm64
          - target: bun-darwin-x64
            asset: gac-darwin-x64
          - target: bun-darwin-arm64
            asset: gac-darwin-arm64
          - target: bun-windows-x64
            asset: gac-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build ${{ matrix.asset }}
        run: |
          set -eu
          version=$(node -p "require('./package.json').version")
          mkdir -p release
          bun build src/cli.ts \
            --compile \
            --target=${{ matrix.target }} \
            --outfile release/${{ matrix.asset }} \
            --define "__GAC_VERSION__=\"$version\""
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          set -eu
          cd release
          sha256sum ./* | sed 's#  \./#  #' > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --generate-notes
